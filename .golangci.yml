version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - gocritic
    - goconst
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    gosec:
      excludes:
        - G304 # file path from variable: expected — this app opens user-chosen photo paths
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # This codebase deliberately keeps doc comments to WHY-only, not a
      # comment on every exported symbol — don't fight that convention.
      - linters: [revive]
        text: "exported"
      - linters: [revive]
        text: "package-comments"

formatters:
  enable:
    - gofmt
    - goimports
